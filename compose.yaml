services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vacunapp
      POSTGRES_USER: vacunapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - datos:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vacunapp -d vacunapp"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: [demo]
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vacunapp
      SPRING_DATASOURCE_USERNAME: vacunapp
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  datos:
